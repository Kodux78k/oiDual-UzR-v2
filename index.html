<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8" />
  <title>DUAL // FUSION OS — Morph & Stagger (small-preview clickable)</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <meta name="theme-color" content="#05070a">
  <link rel="manifest" href="./manifest.json">
  <meta name="theme-color" content="#2563eb">
  <link rel="apple-touch-icon" href="./icon-192.png">

  <script>
    if ('serviceWorker' in navigator) {
      navigator.serviceWorker.register('./sw.js').catch(()=>{/* silent */});
    }
  </script>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@200;400;600;900&family=JetBrains+Mono:wght@400;700&display=swap" rel="stylesheet">
  <script src="https://unpkg.com/lucide@latest"></script>

  <style>
    :root{
      --bg-deep:#030406; --glass-surface:rgba(18,18,22,0.65); --glass-border:rgba(255,255,255,0.06);
      --neon-cyan:#00f2ff; --neon-purple:#bd00ff; --neon-orange:#ff9a3c;
      --font-ui:'Montserrat',sans-serif; --font-code:'JetBrains Mono',monospace;
      --ease-overshoot: cubic-bezier(0.34, 1.3, 0.64, 1);
      --ease-smooth: cubic-bezier(0.23, 1, 0.32, 1);
    }
    *{box-sizing:border-box;-webkit-tap-highlight-color:transparent;outline:none;user-select:none}
    html,body{height:100%}
    body{
      margin:0;padding:0;min-height:100vh;background-color:var(--bg-deep);color:#fff;
      font-family:var(--font-ui);display:flex;align-items:center;justify-content:center;overflow:hidden;
      background-image:
        linear-gradient(rgba(255,255,255,0.02) 1px, transparent 1px),
        linear-gradient(90deg, rgba(255,255,255,0.02) 1px, transparent 1px);
      background-size:50px 50px;
    }

    /* ambient */
    .ambient-light{position:fixed;inset:0;z-index:0;pointer-events:none}
    .blob{position:absolute;border-radius:50%;filter:blur(100px);opacity:0.15;animation:float 25s infinite alternate ease-in-out}
    .blob-1{width:60vw;height:60vw;background:var(--neon-cyan);top:-20%;left:-20%}
    .blob-2{width:50vw;height:50vw;background:var(--neon-purple);bottom:-20%;right:-20%;animation-delay:-5s}
    @keyframes float{0%{transform:translate(0,0)}100%{transform:translate(40px,60px)}}

    .container{width:100%;max-width:640px;padding:20px;z-index:10;perspective:1200px;display:flex;align-items:center;justify-content:center}

    /* FUSION CARD */
    .fusion-card{
      width:100%; max-width:440px;
      background:var(--glass-surface);backdrop-filter:blur(30px);-webkit-backdrop-filter:blur(30px);
      border:1px solid var(--glass-border);border-radius:36px;padding:30px 25px;box-shadow:0 40px 100px rgba(0,0,0,0.8);
      position:relative;overflow:hidden;
      opacity:0; transform:translateY(50px) scale(0.96);
      display:flex;flex-direction:column;gap:8px;
      will-change: width, padding, border-radius, box-shadow, transform;
    }
    .fusion-card.active{opacity:1;transform:translateY(0) scale(1); transition: opacity 0.6s, transform 0.6s var(--ease-smooth);}

    /* ESTADO FECHADO */
    .fusion-card.closed{
      width:260px; max-width:none;
      padding:14px 16px; border-radius:22px;
      box-shadow:0 22px 70px rgba(0,0,0,0.75);
      cursor:pointer;
    }

    /* Adaptações Visuais Fechado */
    .fusion-card.closed .card-header{gap:10px;margin-bottom:0}
    .fusion-card.closed .brand-dual{font-size:1.3rem; margin-top:0; letter-spacing:-1px}
    .fusion-card.closed .greeting-row{font-size:1rem}
    .fusion-card.closed .txt-thin{display:none}
    .fusion-card.closed .card-body{display:none}
    .fusion-card.closed .avatar-slot{width:52px;height:52px}

    .fusion-card.animating{transition: none !important;}

    .fusion-card::before{content:'';position:absolute;top:0;left:0;right:0;height:1px;background:linear-gradient(90deg,transparent,rgba(255,255,255,0.4),transparent)}

    /* HEADER */
    .card-header{display:flex;align-items:center;gap:15px;margin-bottom:18px;transition: margin 0.3s}
    .avatar-slot{width:64px;height:64px;flex-shrink:0;border-radius:12px;overflow:hidden;opacity:0;transition:opacity 0.35s}
    .avatar-slot.shown{opacity:1}

    .text-block{flex:1;display:flex;flex-direction:column;justify-content:center}
    .greeting-row{font-size:1.5rem;line-height:1;display:flex;align-items:baseline;gap:6px;flex-wrap:wrap}
    .txt-thin{font-weight:200;color:rgba(255,255,255,0.7)}
    .txt-heavy{font-weight:600;color:#fff}

    .brand-dual{
      font-size:2.2rem;font-weight:900;line-height:0.95;text-transform:uppercase;letter-spacing:-2px;margin-top:4px;
      background:linear-gradient(-45deg,#fff,var(--neon-cyan),var(--neon-purple),#fff);
      background-size:300%;-webkit-background-clip:text;-webkit-text-fill-color:transparent;animation:gradientFlow 4s ease infinite;
    }
    @keyframes gradientFlow{0%{background-position:0% 50%}50%{background-position:100% 50%}100%{background-position:0% 50%}}

    .clock-widget{text-align:right}
    .time-display{font-family:var(--font-code);font-size:1rem;color:rgba(255,255,255,0.5);font-weight:700}
    .status-led{font-size:0.6rem;color:var(--neon-cyan);text-transform:uppercase;letter-spacing:1px;margin-top:4px;display:block}

    /* --- STAGGER / CASCATA --- */
    .card-body{display:flex;flex-direction:column;gap:12px}

    .stagger-item {
      opacity: 0;
      transform: translateY(15px);
      transition: opacity 0.4s ease, transform 0.4s var(--ease-overshoot);
    }

    .content-visible .stagger-item {
      opacity: 1;
      transform: translateY(0);
    }

    .content-visible .stagger-item:nth-child(1) { transition-delay: 0.1s; }
    .content-visible .stagger-item:nth-child(2) { transition-delay: 0.18s; }
    .content-visible .stagger-item:nth-child(3) { transition-delay: 0.25s; }

    .input-wrapper{position:relative}
    .cyber-input{width:100%;background:rgba(0,0,0,0.3);border:1px solid rgba(255,255,255,0.1);border-radius:16px;padding:16px 50px 16px 18px;color:#fff;font-family:var(--font-code);font-size:0.9rem;transition:0.2s}
    .cyber-input:focus{border-color:var(--neon-cyan);box-shadow:0 0 15px rgba(0,242,255,0.08);background:rgba(0,0,0,0.5)}
    .input-icon{position:absolute;right:18px;top:50%;transform:translateY(-50%);color:rgba(255,255,255,0.3)}

    .trigger-btn{width:100%;padding:12px;border:1px dashed rgba(255,255,255,0.1);border-radius:12px;background:rgba(255,255,255,0.02);color:rgba(255,255,255,0.5);font-size:0.75rem;letter-spacing:2px;text-transform:uppercase;cursor:pointer;display:flex;justify-content:center;align-items:center;gap:8px}
    .trigger-btn:hover{background:rgba(255,255,255,0.04);color:#fff;border-color:rgba(255,255,255,0.3)}

    .hidden-modules{display:grid;grid-template-rows:0fr;opacity:0.6;transition:all 420ms var(--ease-smooth)}
    .fusion-card.open .hidden-modules{grid-template-rows:1fr;opacity:1;margin-top:10px}
    .modules-inner{overflow:hidden;display:flex;flex-direction:column;gap:12px; padding-top:2px;}

    .stats-grid{display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px;margin-top:10px}
    .stat-box{background:rgba(255,255,255,0.03);border-radius:12px;padding:10px;text-align:center;border:1px solid transparent;transition:0.2s}
    .stat-box:hover{border-color:rgba(255,255,255,0.1);background:rgba(255,255,255,0.06)}
    .stat-lbl{font-size:0.55rem;text-transform:uppercase;color:rgba(255,255,255,0.4);display:block;margin-bottom:4px}
    .stat-val{font-family:var(--font-code);font-size:0.9rem;font-weight:700;color:var(--neon-cyan)}

    .progress-container{background:rgba(0,0,0,0.2);padding:12px;border-radius:12px}
    .bar-track{height:4px;background:rgba(255,255,255,0.1);border-radius:2px;overflow:hidden;margin:8px 0}
    .bar-fill{height:100%;width:0%;background:linear-gradient(90deg,var(--neon-cyan),var(--neon-purple));box-shadow:0 0 10px var(--neon-cyan);transition:width 1.2s ease-out}
    .bar-meta{display:flex;justify-content:space-between;font-size:0.6rem;color:rgba(255,255,255,0.4);font-family:var(--font-code)}

    .html-module-slot{border:1px solid var(--neon-orange);background:rgba(255,154,60,0.05);border-radius:12px;padding:12px;min-height:56px;display:flex;align-items:center;justify-content:center;color:var(--neon-orange);font-size:0.7rem;font-family:var(--font-code);text-align:center}

    /* small-preview (visible only when closed) */
    .small-preview{
      display:none;
      align-items:center;
      gap:10px;
      margin-top:8px;
      padding:8px 10px;
      border-radius:10px;
      background:rgba(255,255,255,0.02);
      border:1px solid rgba(255,255,255,0.03);
      font-family:var(--font-code);
      font-size:0.86rem;
      color:rgba(255,255,255,0.9);
      cursor:pointer;
      overflow:hidden;
    }
    .small-preview .mini-avatar{width:30px;height:30px;border-radius:6px;flex-shrink:0;overflow:hidden;display:inline-flex;align-items:center;justify-content:center}
    .small-preview .small-text{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:calc(100% - 110px)}
    .small-preview .ident-badge{margin-left:auto;font-weight:700;font-size:0.78rem;padding:4px 8px;border-radius:999px;background:rgba(255,255,255,0.03);color:rgba(255,255,255,0.9);border:1px solid rgba(255,255,255,0.02)}

    .fusion-card.closed .small-preview{display:flex}

    /* vibe-gold pulse for 3/6/9 */
    .vibe-gold{
      box-shadow: 0 0 0px rgba(255,210,80,0.0);
      animation: vibePulse 1.6s infinite;
      border: 1px solid rgba(255,210,80,0.15);
    }
    @keyframes vibePulse {
      0%{ box-shadow: 0 0 0 0 rgba(255,210,80,0.0); transform: translateY(0); }
      40%{ box-shadow: 0 0 18px 6px rgba(255,210,80,0.06); transform: translateY(-1px) scale(1.01); }
      100%{ box-shadow: 0 0 0 0 rgba(255,210,80,0.0); transform: translateY(0); }
    }

    /* left toolbar */
    .left-tools { position:fixed; left:14px; top:50%; transform:translateY(-50%); display:flex; flex-direction:column; gap:10px; z-index:60; }
    .tool-btn { width:44px; height:44px; border-radius:10px; background:rgba(255,255,255,0.03); display:flex; align-items:center; justify-content:center; cursor:pointer; border:1px solid rgba(255,255,255,0.04); }
    .tool-btn:hover{ transform:translateY(-4px); transition:all .18s ease; }

    /* editor modal */
    .editor-overlay { position:fixed; inset:0; z-index:120; display:none; align-items:center; justify-content:center; background:rgba(0,0,0,0.75); }
    .editor-overlay.active{ display:flex; }
    .editor-card { width:95%; max-width:1100px; height:90%; background:#071018; border-radius:18px; border:1px solid rgba(255,255,255,0.06); display:flex; flex-direction:column; overflow:hidden; box-shadow:0 30px 120px rgba(0,0,0,0.9); }
    .editor-top { display:flex; align-items:center; justify-content:space-between; padding:12px 16px; border-bottom:1px solid rgba(255,255,255,0.03); }
    .editor-area { flex:1; padding:16px; font-family:var(--font-code); font-size:13px; background:transparent; color:#dff; border:0; outline:none; resize:none; }

    /* toast */
    #toast { position:fixed; bottom:22px; left:50%; transform:translateX(-50%); background:rgba(0,0,0,0.8); border:1px solid rgba(0,242,255,0.12); color:var(--neon-cyan); padding:8px 14px; border-radius:999px; font-family:var(--font-code); z-index:220; opacity:0; pointer-events:none; transition:opacity .28s; }

    /* iframe area */
    #navFrame { position:fixed; right:18px; bottom:18px; width:420px; height:300px; border-radius:12px; border:1px solid rgba(255,255,255,0.06); box-shadow:0 20px 60px rgba(0,0,0,0.7); overflow:hidden; z-index:30; background:#000; display:none; }
    #navFrame.visible{ display:block; }

    /* stack list inside modules */
    .stack-list{display:flex;flex-direction:column;gap:8px;margin-top:8px}
    .stack-item{display:flex;justify-content:space-between;align-items:center;padding:10px;border-radius:12px;background:rgba(0,0,0,0.25);border:1px solid rgba(255,255,255,0.02)}
    .stack-item .meta{font-family:var(--font-code);font-size:12px;color:rgba(255,255,255,0.85)}
    .stack-controls button{margin-left:8px}
    @media (max-width:420px){ .fusion-card.closed{width:220px} .brand-dual{font-size:1rem} #navFrame{display:none} }
  </style>
</head>
<body>
  <div class="ambient-light">
    <div class="blob blob-1"></div>
    <div class="blob blob-2"></div>
  </div>

  <!-- left tools -->
  <div class="left-tools" aria-hidden="true">
    <label class="tool-btn" title="Importar HTML" for="uploadHTML" id="btn-import" role="button">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none"><path d="M12 3v12" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/><path d="M8 7l4-4 4 4" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/><path d="M21 21H3" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/></svg>
    </label>
    <input id="uploadHTML" type="file" accept=".html" style="display:none" />
    <div class="tool-btn" id="btn-remote" title="Abrir URL Remota"><svg width="18" height="18" viewBox="0 0 24 24" fill="none"><path d="M12 2a10 10 0 1 0 0 20" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/></svg></div>
    <div class="tool-btn" id="btn-theme" title="Alternar Tema">💡</div>
    <div class="tool-btn" id="btn-editor" title="Editor HTML">✎</div>
    <div class="tool-btn" id="btn-frame-toggle" title="Abrir Preview">📺</div>
  </div>

  <div class="container">
    <div class="fusion-card closed" id="mainCard" aria-expanded="false">
      <div class="card-header" id="cardHeader" role="button" tabindex="0" aria-controls="cardBody" aria-expanded="false">
        <div class="avatar-slot" id="avatarTarget" aria-hidden="true"></div>

        <div class="text-block">
          <div class="greeting-row">
            <span class="txt-thin" id="lblHello">Sistema</span>
            <span class="txt-heavy" id="lblName">Convidado</span>
          </div>
          <div class="brand-dual">DUAL</div>
        </div>

        <div class="clock-widget" aria-hidden="true">
          <div class="time-display" id="clockTime">00:00</div>
          <span class="status-led">ONLINE</span>
        </div>
      </div>

      <!-- SMALL PREVIEW (clicável) -->
      <div class="small-preview" id="smallPreview" title="Clique para abrir e editar a ativação">
        <div class="mini-avatar" id="smallMiniAvatar" aria-hidden="true"></div>
        <div class="small-text" id="smallText">Ativação aparecerá aqui</div>
        <div class="ident-badge" id="smallIdent">--</div>
      </div>

      <div class="card-body" id="cardBody">
        <div class="input-wrapper stagger-item">
          <input type="text" class="cyber-input" id="inputUser" placeholder="Identifique-se..." autocomplete="off" />
          <i data-lucide="fingerprint" class="input-icon"></i>
        </div>

        <div class="trigger-btn stagger-item" id="modulesTrigger">
          <span id="triggerText">ABRIR MÓDULOS</span>
          <i data-lucide="chevron-down" id="triggerIcon"></i>
        </div>

        <div class="hidden-modules stagger-item" id="modulesArea">
          <div class="modules-inner">
            <div class="stats-grid">
              <div class="stat-box">
                <span class="stat-lbl">LATÊNCIA</span>
                <span class="stat-val">12ms</span>
              </div>
              <div class="stat-box">
                <span class="stat-lbl">CPU</span>
                <span class="stat-val">FUSION</span>
              </div>
              <div class="stat-box">
                <span class="stat-lbl">RITMO</span>
                <span class="stat-val">BETA</span>
              </div>
            </div>

            <div class="progress-container">
              <div class="bar-meta">
                <span>CICLO DIÁRIO</span>
                <span id="cyclePercent">0%</span>
              </div>
              <div class="bar-track"><div class="bar-fill" id="cycleFill"></div></div>
            </div>

            <div class="html-module-slot">Arraste .html aqui ou use Importar — módulos listados abaixo</div>

            <div class="stack-list" id="stackList"></div>
          </div>
        </div>
      </div>
    </div>
  </div>

  <!-- iframe preview (injetável) -->
  <iframe id="navFrame" src="about:blank" title="Preview"></iframe>

  <!-- editor modal -->
  <div class="editor-overlay" id="editorModal">
    <div class="editor-card" role="dialog" aria-modal="true" aria-label="Editor HTML">
      <div class="editor-top">
        <div style="font-family:var(--font-code);font-size:12px;color:var(--neon-cyan)">RAW_HTML_EDITOR</div>
        <div>
          <button id="applyEditorBtn" style="margin-right:8px;padding:8px 12px;border-radius:10px;background:var(--neon-cyan);border:0;color:#001">APLICAR</button>
          <button id="closeEditorBtn" style="padding:8px 12px;border-radius:10px;background:transparent;border:1px solid rgba(255,255,255,0.06);color:#fff">FECHAR</button>
        </div>
      </div>
      <textarea id="editorArea" spellcheck="false" class="editor-area" placeholder="Cole seu código HTML aqui..."></textarea>
    </div>
  </div>

  <div id="toast">SYSTEM READY</div>

  <script>
    lucide.createIcons();

    // Elements
    const els = {
      card: document.getElementById('mainCard'),
      header: document.getElementById('cardHeader'),
      avatarTgt: document.getElementById('avatarTarget'),
      input: document.getElementById('inputUser'),
      lblHello: document.getElementById('lblHello'),
      lblName: document.getElementById('lblName'),
      clock: document.getElementById('clockTime'),
      triggerText: document.getElementById('triggerText'),
      triggerIcon: document.getElementById('triggerIcon'),
      modulesArea: document.getElementById('modulesArea'),
      cardBody: document.getElementById('cardBody'),
      smallPreview: document.getElementById('smallPreview'),
      smallMiniAvatar: document.getElementById('smallMiniAvatar'),
      smallText: document.getElementById('smallText'),
      smallIdent: document.getElementById('smallIdent'),
      stackList: document.getElementById('stackList'),
      navFrame: document.getElementById('navFrame'),
      uploadHTML: document.getElementById('uploadHTML'),
      editorModal: document.getElementById('editorModal'),
      editorArea: document.getElementById('editorArea'),
      applyEditorBtn: document.getElementById('applyEditorBtn'),
      closeEditorBtn: document.getElementById('closeEditorBtn'),
      toast: document.getElementById('toast'),
      btnRemote: document.getElementById('btn-remote'),
      btnTheme: document.getElementById('btn-theme'),
      btnEditor: document.getElementById('btn-editor'),
      btnFrameToggle: document.getElementById('btn-frame-toggle'),
      btnImport: document.getElementById('btn-import')
    };

    // --- Avatar helpers (dynamic gradients) ---
    function createAvatarSVG(id, size = 64, seed = 1){
      const hue1 = (seed * 40) % 360;
      const hue2 = (hue1 + 160) % 360;
      return `
        <svg viewBox="0 0 100 100" xmlns="http://www.w3.org/2000/svg" width="${size}" height="${size}" aria-hidden="true">
          <defs>
            <linearGradient id="g${id}" x1="0%" y1="0%" x2="100%" y2="100%">
              <stop offset="0%" style="stop-color:hsl(${hue1}, 100%, 50%)" />
              <stop offset="100%" style="stop-color:hsl(${hue2}, 100%, 50%)" />
            </linearGradient>
            <filter id="f${id}"><feGaussianBlur stdDeviation="3" result="coloredBlur"/><feMerge><feMergeNode in="coloredBlur"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
          </defs>
          <rect width="100" height="100" fill="#050505"/>
          <circle cx="50" cy="50" r="30" fill="url(#g${id})" opacity="0.85">
            <animate attributeName="r" values="28;32;28" dur="3s" repeatCount="indefinite" />
          </circle>
          <circle cx="50" cy="50" r="14" fill="white" opacity="0.14"/>
        </svg>
      `;
    }

    function hashString(str){
      let h = 2166136261 >>> 0;
      for(let i=0;i<str.length;i++){ h ^= str.charCodeAt(i); h = Math.imul(h, 16777619) >>> 0; }
      return h >>> 0;
    }
    function seedToGradient(seed, id='s'){
      const h1 = seed % 360;
      const h2 = (seed * 37) % 360;
      return {id: `gSmall${id}`, svg: `<linearGradient id="gSmall${id}" x1="0%" y1="0%" x2="100%" y2="100%"><stop offset="0%" stop-color="hsl(${h1} 100% 55%)"/><stop offset="100%" stop-color="hsl(${h2} 90% 45%)"/></linearGradient>`};
    }
    function makeMiniAvatarHTML(name, size = 30){
      const seed = hashString(name || 'DUAL');
      const grad = seedToGradient(seed, seed.toString(36));
      return `
        <svg width="${size}" height="${size}" viewBox="0 0 32 32" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
          <defs>${grad.svg}</defs>
          <rect x="0" y="0" width="32" height="32" rx="6" fill="#071018" />
          <circle cx="16" cy="12" r="6" fill="url(#${grad.id})"/>
          <path d="M16 24 a8 4 0 0 1 8 -4" stroke="rgba(255,255,255,0.06)" stroke-width="2" fill="none" stroke-linecap="round"/>
        </svg>
      `;
    }

    // --- Digital root & vibes ---
    function digitalRootFromString(str){
      if(!str || !str.trim()) return null;
      let sum = [...str].reduce((acc, ch)=> acc + ch.charCodeAt(0), 0);
      while(sum > 9) sum = String(sum).split('').reduce((a,b)=> a+Number(b), 0);
      return sum;
    }

    function reduce369Short(name){
      const root = digitalRootFromString(name);
      return root === null ? '--' : root;
    }

    // --- Small preview update ---
    function updateSmallPreviewFromName(name){
      const now = new Date();
      const PHRASES_24 = [
        "Ativar foco estável.","Sintonizar ritmo criativo.","Amplificar percepção sutil.","Conectar ao core de coesão.",
        "Iniciar limpeza cognitiva.","Engatar modo produtividade.","Equilibrar fluxo emocional.","Elevar nível de curiosidade.",
        "Refinar intenção principal.","Fortalecer memória ativa.","Sincronizar com ciclo terrestre.","Ativar shield de atenção.",
        "Optimizar caminhos de decisão.","Despertar intuição prática.","Atenuar ruídos internos.","Mapear prioridades do dia.",
        "Habilitar modo aprendizado.","Sintonizar voz interior clara.","Aumentar resiliência mental.","Abrir canal de insights.",
        "Energetizar campo criativo.","Ancorar objetivos curtos.","Preparar para execução suave.","Concluir com gratidão."
      ];
      const phrase = PHRASES_24[now.getHours() % 24];
      const miniText = (name && name.trim()) ? `${name.trim()} · ${phrase}` : `Ativação aparecerá aqui`;
      els.smallText.innerText = miniText;
      const root = reduce369Short(name);
      els.smallIdent.innerText = (root === '--') ? '--' : `v:${root}`;
      els.smallPreview.classList.remove('vibe-gold');
      if(root === 3 || root === 6 || root === 9) els.smallPreview.classList.add('vibe-gold');
      els.smallMiniAvatar.innerHTML = makeMiniAvatarHTML(name || 'DUAL', 30);
    }

    // --- Toast ---
    let toastTimer = null;
    function showToast(msg){
      els.toast.innerText = msg;
      els.toast.style.opacity = '1';
      if(toastTimer) clearTimeout(toastTimer);
      toastTimer = setTimeout(()=>{ els.toast.style.opacity = '0'; }, 2200);
    }

    // --- Editor Modal ---
    function openEditor(){
      els.editorArea.value = localStorage.getItem('fusion_last_html') || '';
      els.editorModal.classList.add('active');
    }
    function closeEditor(){ els.editorModal.classList.remove('active'); }
    function applyEditor(){
      const code = els.editorArea.value;
      localStorage.setItem('fusion_last_html', code);
      injectToFrame(code);
      showToast('CÓDIGO INJETADO');
      closeEditor();
    }

    // --- Frame injection / remote open ---
    function injectToFrame(html){
      if(!html) return;
      els.navFrame.classList.add('visible');
      // use srcdoc for direct injection when possible
      try {
        els.navFrame.srcdoc = html;
      } catch(e){
        // fallback to blob
        const blob = new Blob([html], {type:'text/html'});
        els.navFrame.src = URL.createObjectURL(blob);
      }
    }
    function openRemote(){
      const url = prompt('Informe a URL remota (https://...)');
      if(!url) return;
      els.navFrame.classList.add('visible');
      els.navFrame.src = url;
      showToast('URL CARREGADA');
    }

    // --- Theme toggle (simple) ---
    function toggleTheme(){
      document.body.classList.toggle('light-mode');
      const isLight = document.body.classList.contains('light-mode');
      showToast(isLight ? 'Tema claro' : 'Tema escuro');
      // small visual tweak: change navFrame visibility for small screens handled via CSS
    }

    // --- Stacks (modules) management ---
    const stacksKey = 'fusion_stacks';

    function loadStacks(){
      const raw = localStorage.getItem(stacksKey) || '[]';
      try {
        AppState.stacks = JSON.parse(raw);
      } catch(e){
        AppState.stacks = [];
      }
      renderStacks();
    }

    function saveStacks(){
      localStorage.setItem(stacksKey, JSON.stringify(AppState.stacks));
    }

    function renderStacks(){
      const list = els.stackList;
      list.innerHTML = '';
      if(!AppState.stacks.length){
        list.innerHTML = '<div style="padding:12px;color:rgba(255,255,255,0.18);font-family:var(--font-code);font-size:12px;border-radius:8px">VETORES VAZIOS</div>';
        return;
      }
      AppState.stacks.forEach((s, i) => {
        const item = document.createElement('div');
        item.className = 'stack-item';
        item.innerHTML = `
          <div style="display:flex;flex-direction:column;gap:4px">
            <div style="font-weight:700">${s.name}</div>
            <div class="meta">${s.date}</div>
          </div>
          <div class="stack-controls">
            <button data-action="run" data-i="${i}" title="Executar" style="padding:6px 8px;border-radius:8px;background:var(--neon-cyan);border:0;color:#001">▶</button>
            <button data-action="edit" data-i="${i}" title="Editar" style="padding:6px 8px;border-radius:8px;background:transparent;border:1px solid rgba(255,255,255,0.06);color:#fff">✎</button>
            <button data-action="del" data-i="${i}" title="Remover" style="padding:6px 8px;border-radius:8px;background:transparent;border:1px solid rgba(255,255,255,0.06);color:#fff">✕</button>
          </div>
        `;
        list.appendChild(item);
      });
    }

    function runStack(i){
      const s = AppState.stacks[i];
      if(!s) return;
      injectToFrame(s.content);
      showToast(`EXECUTANDO: ${s.name}`);
      // close UI gently
      if(!els.card.classList.contains('closed')) toggleCard();
    }

    function editStack(i){
      const s = AppState.stacks[i];
      if(!s) return;
      els.editorArea.value = s.content || '';
      els.editorModal.classList.add('active');
      // when apply, replace stack instead of new push (handled via applyEditor when editing)
      // mark editing index
      AppState.editingIndex = i;
    }

    function deleteStack(i){
      if(!confirm('Remover módulo?')) return;
      AppState.stacks.splice(i,1);
      saveStacks();
      renderStacks();
      showToast('MÓDULO REMOVIDO');
    }

    // file upload handler
    function handleFileUpload(file){
      if(!file) return;
      const reader = new FileReader();
      reader.onload = (ev) => {
        AppState.stacks.unshift({
          name: file.name,
          content: ev.target.result,
          date: new Date().toLocaleString()
        });
        saveStacks();
        renderStacks();
        showToast('MÓDULO ADICIONADO');
      };
      reader.readAsText(file);
    }

    // drag and drop to modulesArea
    function initDragDrop(){
      const area = els.modulesArea;
      area.addEventListener('dragover', (e)=>{ e.preventDefault(); area.style.borderColor = 'rgba(0,242,255,0.18)'; });
      area.addEventListener('dragleave', ()=>{ area.style.borderColor = ''; });
      area.addEventListener('drop', (e)=>{
        e.preventDefault();
        area.style.borderColor = '';
        const file = e.dataTransfer.files && e.dataTransfer.files[0];
        if(file && file.name.endsWith('.html')) handleFileUpload(file);
      });
    }

    // --- App state / init ---
    const AppState = { isOpen:false, user: 'Convidado', stacks: [], editingIndex: null };

    function updateAvatar(name){
      const seed = (hashString(name || 'DUAL') % 20) + 1;
      els.avatarTgt.innerHTML = createAvatarSVG('A'+seed, 64, seed);
    }

    function setUserName(name, speakIt = true){
      const val = (name && name.trim()) || 'Convidado';
      AppState.user = val;
      els.input.value = (val === 'Convidado') ? '' : val;
      els.lblHello.innerText = (val === 'Convidado') ? 'Sistema' : 'Oi,';
      els.lblName.innerText = val;
      localStorage.setItem('fusion_user', val);
      updateSmallPreviewFromName(val);
      updateAvatar(val);
      if(speakIt) speak(val === 'Convidado' ? 'Sistema Dual pronto.' : `Bem-vindo, ${val}.`);
      // vibe gold
      const root = digitalRootFromString(val);
      if([3,6,9].includes(root)) els.card.classList.add('vibe-gold'); else els.card.classList.remove('vibe-gold');
    }

    // --- Card morph / toggle with stagger ---
    const morph = {
      closed: { width: '260px', padding: '14px 16px', borderRadius: '22px', boxShadow: '0 22px 70px rgba(0,0,0,0.75)', scale: 0.995 },
      open:   { width: '440px', padding: '30px 25px', borderRadius: '36px', boxShadow: '0 40px 100px rgba(0,0,0,0.8)', scale: 1 }
    };

    function toggleCard() {
      if(els.card.classList.contains('animating')) return;
      const isOpening = els.card.classList.contains('closed');
      els.card.classList.add('animating');
      const start = isOpening ? morph.closed : morph.open;
      const end = isOpening ? morph.open : morph.closed;

      // prepare
      if(isOpening) {
        els.card.classList.remove('closed');
        els.card.setAttribute('aria-expanded', 'true');
      } else {
        els.card.classList.remove('content-visible');
        if(els.card.classList.contains('open')) toggleDetails(false);
      }

      // inline style start
      els.card.style.width = start.width;
      els.card.style.padding = start.padding;
      els.card.style.borderRadius = start.borderRadius;
      els.card.style.boxShadow = start.boxShadow;
      els.card.style.transform = `scale(${start.scale})`;

      const easing = isOpening ? 'cubic-bezier(0.34, 1.3, 0.64, 1)' : 'cubic-bezier(0.23, 1, 0.32, 1)';
      const duration = isOpening ? 600 : 450;

      const anim = els.card.animate([
        { width: start.width, padding: start.padding, borderRadius: start.borderRadius, boxShadow: start.boxShadow, transform: `scale(${start.scale})` },
        { width: end.width, padding: end.padding, borderRadius: end.borderRadius, boxShadow: end.boxShadow, transform: `scale(${end.scale})` }
      ], { duration, easing, fill: 'forwards' });

      anim.onfinish = () => {
        els.card.classList.remove('animating');
        // clear inline styles for CSS to take over
        els.card.style.width = '';
        els.card.style.padding = '';
        els.card.style.borderRadius = '';
        els.card.style.boxShadow = '';
        els.card.style.transform = '';
        if(isOpening) {
          els.card.classList.add('content-visible');
          els.input.focus();
        } else {
          els.card.classList.add('closed');
          els.card.setAttribute('aria-expanded', 'false');
        }
      };
    }

    // --- Toggle modules area (accordion) ---
    function toggleDetails(userTriggered = true){
      els.card.classList.toggle('open');
      const isOpen = els.card.classList.contains('open');
      els.triggerText.innerText = isOpen ? 'FECHAR MÓDULOS' : 'ABRIR MÓDULOS';
      els.triggerIcon.setAttribute('data-lucide', isOpen ? 'chevron-up' : 'chevron-down');
      lucide.createIcons();
      if(isOpen && userTriggered) speak('Carregando módulos.');
    }

    // --- Clock & metrics ---
    function updateMetrics(){
      const now = new Date();
      els.clock.innerText = now.toLocaleTimeString('pt-BR',{hour:'2-digit',minute:'2-digit'});
      const pct = Math.min(100, Math.max(0, ((now.getHours() + now.getMinutes()/60) / 24) * 100));
      document.getElementById('cycleFill').style.width = `${pct}%`;
      document.getElementById('cyclePercent').innerText = `${Math.floor(pct)}%`;
    }

    // --- TTS ---
    function speak(text){
      if(!window.speechSynthesis) return;
      window.speechSynthesis.cancel();
      if(!text) return;
      const u = new SpeechSynthesisUtterance(text);
      u.lang = 'pt-BR'; u.rate = 1.05;
      window.speechSynthesis.speak(u);
    }

    // --- Event wiring & init ---
    document.addEventListener('DOMContentLoaded', () => {
      setTimeout(()=> {
        els.card.classList.add('active');
        els.avatarTgt.classList.add('shown');

        // load saved user & stacks
        const saved = localStorage.getItem('fusion_user');
        if(saved){ setUserName(saved, false); updateSmallPreviewFromName(saved); speak(`Bem-vindo de volta, ${saved}.`); }
        else { setUserName('Convidado', false); updateSmallPreviewFromName(''); speak('Sistema Dual pronto.'); }

        loadStacks();
        initDragDrop();
        lucide.createIcons();
      }, 120);
    });

    // header open/close
    els.header.addEventListener('click', toggleCard);
    els.header.addEventListener('keydown', (e)=> { if(e.key === 'Enter'||e.key===' ') { e.preventDefault(); toggleCard(); } });

    // small-preview click
    els.smallPreview.addEventListener('click', (e) => {
      if(els.card.classList.contains('closed')) { toggleCard(); setTimeout(()=> els.input.focus(), 500); }
      else els.input.focus();
    });

    // input events
    els.input.addEventListener('input', (e)=>{
      const v = e.target.value;
      if(v){ els.lblHello.innerText = 'Oi,'; els.lblName.innerText = v; }
      else { els.lblHello.innerText = 'Sistema'; els.lblName.innerText = 'Convidado'; }
      updateSmallPreviewFromName(v);
    });
    els.input.addEventListener('blur', (e)=>{
      const v = e.target.value.trim();
      if(v){
        localStorage.setItem('fusion_user', v);
        setUserName(v, true);
      }
    });
    els.input.addEventListener('keydown', (e)=> { if(e.key === 'Enter') e.target.blur(); });

    // modules trigger
    document.getElementById('modulesTrigger').addEventListener('click', ()=> toggleDetails());

    // upload input
    els.uploadHTML.addEventListener('change', (ev)=> {
      const file = ev.target.files && ev.target.files[0];
      if(file) handleFileUpload(file);
      els.uploadHTML.value = '';
    });

    // left toolbar
    els.btnRemote.addEventListener('click', openRemote);
    els.btnTheme.addEventListener('click', toggleTheme);
    els.btnEditor.addEventListener('click', openEditor);
    els.btnFrameToggle.addEventListener('click', ()=> {
      els.navFrame.classList.toggle('visible');
    });
    // import label handles click via input (already wired)

    // editor modal buttons
    els.applyEditorBtn.addEventListener('click', () => {
      // if editing a stack, replace stack content
      if(AppState.editingIndex !== null && AppState.stacks[AppState.editingIndex]){
        AppState.stacks[AppState.editingIndex].content = els.editorArea.value;
        AppState.stacks[AppState.editingIndex].date = new Date().toLocaleString();
        saveStacks();
        renderStacks();
        AppState.editingIndex = null;
        showToast('MÓDULO ATUALIZADO');
        closeEditor();
        return;
      }
      applyEditor();
    });
    els.closeEditorBtn.addEventListener('click', ()=> {
      AppState.editingIndex = null;
      closeEditor();
    });

    // stack-list click (delegation)
    els.stackList.addEventListener('click', (e) => {
      const btn = e.target.closest('button');
      if(!btn) return;
      const action = btn.getAttribute('data-action');
      const idx = Number(btn.getAttribute('data-i'));
      if(action === 'run') runStack(idx);
      if(action === 'edit') editStack(idx);
      if(action === 'del') deleteStack(idx);
    });

    // drop on body to import quickly
    document.body.addEventListener('dragover', (e)=> e.preventDefault());
    document.body.addEventListener('drop', (e)=>{
      e.preventDefault();
      const file = e.dataTransfer.files && e.dataTransfer.files[0];
      if(file && file.name.endsWith('.html')) handleFileUpload(file);
    });

    // small helper to inject content when applying editor directly
    function applyEditorDirectly(html){
      localStorage.setItem('fusion_last_html', html || '');
      injectToFrame(html);
    }

    // expose some functions to console for convenience
    window.injectToFrame = injectToFrame;
    window.openRemote = openRemote;
    window.toggleTheme = toggleTheme;

    // periodic updates
    setInterval(updateMetrics, 1000);
    updateMetrics();

    // small utilities used above
    function handleFileUpload(file){
      if(!file) return;
      const reader = new FileReader();
      reader.onload = (ev) => {
        AppState.stacks.unshift({
          name: file.name,
          content: ev.target.result,
          date: new Date().toLocaleString()
        });
        saveStacks();
        renderStacks();
        showToast("MÓDULO ADICIONADO");
      };
      reader.readAsText(file);
    }

    // implement runStack/editStack/deleteStack functions used earlier
    function runStack(i){
      const s = AppState.stacks[i];
      if(!s) { showToast('MÓDULO não encontrado'); return; }
      injectToFrame(s.content);
      showToast(`EXECUTANDO: ${s.name}`);
      if(!els.card.classList.contains('closed')) toggleCard();
    }
    function editStack(i){
      const s = AppState.stacks[i];
      if(!s) return;
      AppState.editingIndex = i;
      els.editorArea.value = s.content || '';
      els.editorModal.classList.add('active');
    }
    function deleteStack(i){
      if(!confirm('Remover módulo?')) return;
      AppState.stacks.splice(i,1);
      saveStacks();
      renderStacks();
      showToast('MÓDULO REMOVIDO');
    }

    // initial avatar
    els.avatarTgt.innerHTML = createAvatarSVG('init', 64, 3);

  </script>
</body>
</html>
